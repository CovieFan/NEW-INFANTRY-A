# ---------------------------------------------------------------------------
# NEW-INFANTRY-A（STM32F427IIHx，A 板）—— DAPLink / CMSIS-DAP 调试配置
#
# 用法（在工程根目录）：
#   openocd -f openocd/cmsis-dap-f427.cfg
# 手动烧录：
#   openocd -f openocd/cmsis-dap-f427.cfg ^
#           -c "program build/Debug/NEW-INFANTRY-A.elf verify reset exit"
#
# 需要环境变量 OPENOCD_SCRIPTS 指向 OpenOCD 的 scripts 目录（本机已设）。
# DAPLink 属于 CMSIS-DAP，OpenOCD 原生支持，Windows 下免驱。
# ---------------------------------------------------------------------------

# 1) 探针：CMSIS-DAP（DAPLink / 各种 OB 板）
source [find interface/cmsis-dap.cfg]

# 2) 物理层：SWD
transport select swd

# 3) 时钟：F427 主频 180 MHz，1 MHz 是稳妥的起点；
#    若出现 "Error: init mode failed / unable to connect"，改 500 或 200 再试。
adapter speed 1000

# 4) 目标芯片
source [find target/stm32f4x.cfg]
