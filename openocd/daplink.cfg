# ---------------------------------------------------------------------------
# DAPLink / CMSIS-DAP 调试与烧录配置（与工程名无关，可随工程模板复制）
#
# 用法（在工程根目录）：
#   openocd -f openocd/daplink.cfg
# 手动烧录：
#   openocd -f openocd/daplink.cfg ^
#           -c "program build/Debug/firmware.elf verify reset exit"
#
# 依赖环境变量 OPENOCD_SCRIPTS 指向 OpenOCD 的 scripts 目录（本机已设）。
# 需要换芯片时只改最后一行 target/xxx.cfg（这是本工程唯一与芯片绑定的地方）。
# ---------------------------------------------------------------------------

# 1) 探针：CMSIS-DAP（DAPLink / 各种 OB 板）
source [find interface/cmsis-dap.cfg]

# 2) 物理层：SWD
transport select swd

# 3) 时钟：1 MHz 是稳妥起点；
#    若出现 "Error: init mode failed / unable to connect"，改 500 或 200 再试。
adapter speed 1000

# 4) 目标芯片：F4 系列（F427 在 F4x 配置里）
source [find target/stm32f4x.cfg]
